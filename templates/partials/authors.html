{# Author cards inside articles, as on the old site: round photo, "Name - Role", e-mail. #}
<ul class="author-cards">
  {% for p in people %}
  <li class="author-card">
    <a class="author-card__photo" href="{{ p.url }}" tabindex="-1" aria-hidden="true">{% if p.get('photo') %}<img src="{{ p.photo }}" alt="" loading="lazy">{% endif %}</a>
    <div>
      <p class="author-card__name"><a href="{{ p.url }}">{{ p.get('title') or p.name }}</a></p>
      {% if p.get('email') %}<p class="author-card__email">E: <a href="mailto:{{ p.email }}">{{ p.email }}</a></p>{% endif %}
    </div>
  </li>
  {% endfor %}
</ul>
