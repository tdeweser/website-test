<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__logo" href="/" aria-label="{{ site.title }} — home">
      <img src="/assets/ds/assets/logo/ipe-logo-vertical.png" alt="{{ site.title }}" width="88" height="69">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span class="nav-toggle__label">Menu</span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Hoofdmenu">
      <ul class="site-nav__list">
        {% for group in nav %}
        <li class="site-nav__group">
          <button class="site-nav__trigger" type="button" aria-expanded="false">{{ group.title }}</button>
          <ul class="site-nav__menu">
            {% for item in group['items'] %}
            <li><a href="{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
            {% endfor %}
          </ul>
        </li>
        {% endfor %}
        <li><a class="site-nav__link" href="/highlights/"{% if page.url.startswith('/highlights/') %} aria-current="page"{% endif %}>Publicaties</a></li>
        <li class="site-nav__cta"><a class="button" href="{{ site.cta.url }}">{{ site.cta.title }}</a></li>
      </ul>
    </nav>
  </div>
</header>
