<!-- @dsCard group="Type" viewport="700x320" name="Display & Headings — DM Sans" subtitle="Hierarchy in DM Sans, sentence case" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--font-sans); color: var(--text-body); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .tag { font: 400 10px/1 var(--font-mono); color: var(--text-muted); letter-spacing: 0.06em; white-space: nowrap; width: 96px; flex: 0 0 auto; text-transform: uppercase; }
</style>
</head>
<body>
<div class="stack">
  <div class="line"><span class="tag">Display 64</span><span style="font: var(--type-display); letter-spacing: var(--tracking-tight);">Inhoud met impact</span></div>
  <div class="line"><span class="tag">H1 48</span><span style="font: var(--type-h1); letter-spacing: var(--tracking-tight);">Beter beleid, sneller</span></div>
  <div class="line"><span class="tag">H2 36</span><span style="font: var(--type-h2);">Onderzoek en voorstellen</span></div>
  <div class="line"><span class="tag">H3 28</span><span style="font: var(--type-h3);">Een onafhankelijke stem</span></div>
</div>
</body>
</html>
