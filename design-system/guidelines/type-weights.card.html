<!-- @dsCard group="Type" viewport="700x220" name="Weights — DM Sans" subtitle="The three self-hosted weights used across the brand" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--font-sans); color: var(--text-body); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .w { display: flex; align-items: baseline; gap: 16px; }
  .tag { font: 400 11px/1 var(--font-mono); color: var(--text-muted); width: 140px; flex: 0 0 auto; }
  .sample { font-size: 30px; line-height: 1.25; }
</style>
</head>
<body>
<div class="stack">
  <div class="w"><span class="tag">400 Regular</span><span class="sample" style="font-weight:400">Publieke economie</span></div>
  <div class="w"><span class="tag">500 Medium</span><span class="sample" style="font-weight:500">Publieke economie</span></div>
  <div class="w"><span class="tag">700 Bold</span><span class="sample" style="font-weight:700">Publieke economie</span></div>
  <div class="w"><span class="tag">400 Italic</span><span class="sample" style="font-weight:400; font-style:italic">Publieke economie</span></div>
</div>
<p style="font: var(--type-small); color: var(--text-muted); margin: 18px 0 0; max-width: 600px;">Self-hosted weights: Regular, Medium &amp; Bold (+ italics) — the weights the brand uses in print and on screen. DM Sans supports a wider range; add more TTFs to extend.</p>
</body>
</html>
